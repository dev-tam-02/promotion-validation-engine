version: '3.9'

services:
  validation-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: promix/validation-engine:latest
    container_name: validation-engine
    environment:
      # Spring profiles
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081

      # Database
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/promixdb
      SPRING_DATASOURCE_USERNAME: promix
      SPRING_DATASOURCE_PASSWORD: promix123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

      # Redis cache
      SPRING_REDIS_HOST: localhost
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_PASSWORD: promix123

      # JVM options for container
      JAVA_OPTS: >
        -Xms512m
        -Xmx1g
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
        -XX:+ExitOnOutOfMemoryError
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/tmp/heapdump.hprof
        -Djava.security.egd=file:/dev/./urandom
        -Dspring.jmx.enabled=true
        -Dcom.sun.management.jmxremote
        -Dcom.sun.management.jmxremote.port=9091
        -Dcom.sun.management.jmxremote.rmi.port=9091
        -Dcom.sun.management.jmxremote.authenticate=false
        -Dcom.sun.management.jmxremote.ssl=false

      # Debug port
      DEBUG_OPTS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5001

    ports:
      - "8081:8081"    # Application port
      - "5001:5001"    # Debug port
      - "9091:9091"    # JMX port

    volumes:
      - ./logs:/app/logs
      - ./src/main/resources/rules:/app/rules:ro
      - heap-dumps:/tmp

    networks:
      - promix-network

    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

    restart: unless-stopped

volumes:
  heap-dumps:
    driver: local

networks:
  promix-network:
    external: true
    name: promix-network