version: '3.8'

networks:
  promix-network:
    external: true

services:
  rule-engine:
    build:
      context: .
      dockerfile: Dockerfile
    image: rule-engine-service:latest
    container_name: rule-engine-service
    restart: unless-stopped
    networks:
      - promix-network
    environment:
      # MariaDB Configuration (rule-engine dùng MariaDB)
      - SPRING_DATASOURCE_URL=jdbc:mariadb://mariadb:3306/rule_engine?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=123123a@

      # MinIO Configuration
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=123123a@

      # Kafka Cluster Configuration
      - SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS=kafka-1:9092,kafka-2:9092,kafka-3:9092

      # Kafka SASL Authentication
      - PROMIX_MESSAGING_KAFKA_SASL_ENABLED=true
      - PROMIX_MESSAGING_KAFKA_SASL_MECHANISM=PLAIN
      - PROMIX_MESSAGING_KAFKA_SASL_SECURITY_PROTOCOL=SASL_PLAINTEXT
      - PROMIX_MESSAGING_KAFKA_SASL_USERNAME=admin
      - PROMIX_MESSAGING_KAFKA_SASL_PASSWORD=123123a@

      # Redis Cluster Configuration
      - PROMIX_CACHE_REDISSON_CONFIG_CLUSTER_NODES_ADDRESSES=redis://node1:6379,redis://node2:6380,redis://node3:6381
      - PROMIX_CACHE_REDISSON_PASSWORD=123123a@

      # JVM Options
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseG1GC

      # Application Configuration
      - SERVER_PORT=8080
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=health,info,metrics,prometheus

      # Logging
      - LOGGING_LEVEL_ROOT=INFO
      - LOGGING_LEVEL_VN_VIETTEL_VDS=DEBUG

    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rule-engine.rule=Host(`rule-engine.promixhub.com`)"
      - "traefik.http.routers.rule-engine.entrypoints=websecure"
      - "traefik.http.routers.rule-engine.tls=true"
      - "traefik.http.routers.rule-engine.tls.certresolver=myresolver"
      - "traefik.http.services.rule-engine.loadbalancer.server.port=8080"
      - "traefik.http.services.rule-engine.loadbalancer.healthcheck.path=/actuator/health"
      - "traefik.http.routers.rule-engine.middlewares=rule-engine-ratelimit,rule-engine-headers"
      - "traefik.http.middlewares.rule-engine-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.rule-engine-headers.headers.customResponseHeaders.X-Frame-Options=DENY"
