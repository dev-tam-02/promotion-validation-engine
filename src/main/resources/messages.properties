RULE_COMPILATION_ERROR=Rule compilation failed: {0}
RULE_EXECUTION_ERROR=Rule execution error: {0}
INVALID_RULE_FORMAT=Invalid rule format: {0}

# Session Management Error Messages
SESSION_CREATION_ERROR=Failed to create Drools session: {0}
SESSION_POOL_EXHAUSTED=Session pool exhausted, maximum sessions reached
SESSION_TIMEOUT=Session timeout exceeded: {0}

# Validation Error Messages
VALIDATION_FAILED=Validation failed: {0}
INVALID_REQUEST_FORMAT=Invalid request format: {0}
MISSING_REQUIRED_FIELD=Required field missing: {0}
