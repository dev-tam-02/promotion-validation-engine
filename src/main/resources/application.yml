# validation-engine Service Configuration

# MinIO Object Storage Configuration
minio:
  endpoint: http://minio:9000
  access-key: admin
  secret-key: 123123a@
  bucket-name: validation-bundles
  auto-create-bucket: true
  connect-timeout: 10000
  write-timeout: 60000
  read-timeout: 60000

spring:
  # Exclude Zipkin auto-configuration to prevent connection attempts
  autoconfigure:
    exclude:
      - org.springframework.boot.actuate.autoconfigure.tracing.zipkin.ZipkinAutoConfiguration
  application:
    name: validation-engine
    context-path: /promotion/promotion-validation-engine

  # DataSource Configuration for MariaDB
  datasource:
    url: jdbc:mariadb://${DB_HOST:promotion-mariadb}:${DB_PORT:3306}/${DB_NAME:rule_engine}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123123a@}
    driver-class-name: org.mariadb.jdbc.Driver

    # HikariCP connection pool settings
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      pool-name: ValidationEngineHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate # Use 'update' for development, 'validate' for production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB106Dialect
        show_sql: false
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        enable_lazy_load_no_trans: false
        default_batch_fetch_size: 16
    open-in-view: false
    generate-ddl: false

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${DB_NAME:rule_engine}
    liquibase-schema: ${DB_NAME:rule_engine}

# Server Configuration
server:
  port: 16013

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: ${spring.application.context-path}/v3/api-docs
  swagger-ui:
    path: ${spring.application.context-path}/swagger-ui.html

# Eureka Configuration
eureka:
  client:
    enabled: true
    healthcheck:
      enabled: true
    fetch-registry: true
    register-with-eureka: true
    instance-info-replication-interval-seconds: 10
    registry-fetch-interval-seconds: 10
    service-url:
      defaultZone: http://service-registry:8761/eureka
  instance:
    appname: promotion-${spring.application.name}
    instanceId: promotion-${spring.application.name}:${spring.application.instance-id:${random.value}}
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 10
    status-page-url-path: ${management.endpoints.web.base-path}/info
    health-check-url-path: ${management.endpoints.web.base-path}/health
    virtual-host-name: promotion-${spring.application.name}

# Management Configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: true  # Enable Zipkin sender creation (required for Tracer bean)
      endpoint: "http://localhost:65535/api/v2/spans"  # Fake endpoint - no actual connection

# Promix Platform Configuration - Only essential overrides
promix:
  # Observer Configuration (Tracing, Logging, Metrics)
  observer:
    enabled: true
    tracing:
      enabled: true
      service-name: ${spring.application.name}

  # JPA Configuration
  data:
    jpa:
      enabled: true
      repository-scan-enabled: true
      audit:
        enabled: true
        date-time-provider: system

  # Kafka Configuration
  messaging:
    kafka:
      bootstrap-servers:
        - kafka-1:9092
        - kafka-2:9093
        - kafka-3:9094
      client-id: validation-engine

      # Security Configuration
      security:
        protocol: SASL_PLAINTEXT
      #
      # SASL Authentication Configuration
      sasl:
        enabled: true
        mechanism: PLAIN
        security-protocol: SASL_PLAINTEXT
        username: admin
        password: 123123a@
      consumer:
        group-id: validation-engine-group

  # Cache Configuration
  cache:
    # MASTER SWITCH: Enable cache support globally (required for any cache provider)
    enabled: true

    # Keep Caffeine enabled for high-performance local caches (rule-bundles, limits-snapshots, kie-base)
    # These are configured in CacheConfiguration.java with custom CaffeineCacheManager
    caffeine:
      enabled: true

    # Disable standard Redis cache manager (replaced by Redisson)
    redis:
      enabled: false
      cluster:
        nodes: [ ]  # Empty to prevent initialization

    # Enable Redisson for distributed caching (secondary cache manager if needed)
    redisson:
      enabled: true
      mode: CLUSTER
      password: 123123a@
      connection-timeout: 3000
      timeout: 3000
      retry-attempts: 3
      retry-interval: 1500
      default-ttl: 30m
      max-idle-time: 15m
      default-max-size: 1000

      # Use JSON codec for better compatibility with Drools objects
      codec: org.redisson.codec.JsonJacksonCodec

      # Connection pool settings
      pool:
        min-idle: 5
        max-pool-size: 50

      # Redis cluster configuration
      cluster:
        nodes:
          - redis://node1:6379
          - redis://node2:6380
          - redis://node3:6381
        max-redirections: 3
        scan-interval: 1000

# Bundle Preload Configuration
validation:
  engine:
    bundle:
      preload-enabled: true
      preload-on-startup: true
      preload-timeout-minutes: 10
      prewarm-session-pool: true
      prewarm-session-count: 3
      health-check-interval-seconds: 300

# Logging Configuration
logging:
  level:
    root: INFO
    vn.viettel.vds.promotion: INFO