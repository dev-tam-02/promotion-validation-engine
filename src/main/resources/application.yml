# rule-engine Service Configuration

# MinIO Object Storage Configuration
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:123123a@}
  bucket-name: ${MINIO_BUCKET_NAME:validation-bundles}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  connect-timeout: ${MINIO_CONNECT_TIMEOUT:3000}
  write-timeout: ${MINIO_WRITE_TIMEOUT:30000}
  read-timeout: ${MINIO_READ_TIMEOUT:10000}

spring:
  application:
    name: rule-engine
    context-path: /promotion/promotion-rule-engine

  # Spring Kafka defaults (fallback for kafkaListenerContainerFactory)
  kafka:
    bootstrap-servers:
      - kafka-1:9192
      - kafka-2:9193
      - kafka-3:9194
    properties:
      security.protocol: SASL_PLAINTEXT
      sasl.mechanism: PLAIN
      sasl.jaas.config: >-
        org.apache.kafka.common.security.plain.PlainLoginModule required
        username="${KAFKA_SASL_USERNAME:admin}"
        password="${KAFKA_SASL_PASSWORD:123123a@}";
    consumer:
      group-id: rule-engine-group
      auto-offset-reset: latest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "vn.viettel.vds.promotion.*"
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 1

  # DataSource Configuration for MariaDB
  datasource:
    url: jdbc:mariadb://${DB_HOST:mariadb}:${DB_PORT:3306}/${DB_NAME:promotion_rule_engine}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8mb4
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123123a@}
    driver-class-name: org.mariadb.jdbc.Driver

    # HikariCP connection pool settings
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      pool-name: RuleEngineHikariPool
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none # Use 'update' for development, 'validate' for production
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDB106Dialect
        show_sql: false
        format_sql: true
        use_sql_comments: false
        jdbc:
          batch_size: 20
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        enable_lazy_load_no_trans: false
        default_batch_fetch_size: 16
    open-in-view: false
    generate-ddl: false

  # Liquibase Configuration
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

# Server Configuration
server:
  port: 16013

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: ${spring.application.context-path}/v3/api-docs
  swagger-ui:
    path: ${spring.application.context-path}/swagger-ui.html

# Management Configuration
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    enabled: true
    sampling:
      probability: 1.0

# Promix Platform Configuration - Only essential overrides
promix:
  # Observer Configuration (Tracing, Logging, Metrics)
  observer:
    enabled: true
    tracing:
      enabled: true
      service-name: ${spring.application.name}

  # JPA Configuration
  data:
    jpa:
      enabled: true
      repository-scan-enabled: true
      audit:
        enabled: true
        date-time-provider: system

  # Outbox Configuration — Promix starter (transactional outbox + scheduled Kafka publisher)
  outbox:
    enabled: true
    jpa:
      enabled: true
    kafka:
      enabled: true
    batch:
      enabled: true
      interval: 5000
      chunk-size: 50
    schedule:
      enabled: true
    cleanup:
      enabled: true

  # Kafka Configuration
  messaging:
    enabled: true
    kafka:
      bootstrap-servers: kafka-1:9192,kafka-2:9193,kafka-3:9194
      client-id: rule-engine
      enable-avro: false

      # Security Configuration
      security:
        protocol: SASL_PLAINTEXT

      # SASL Authentication Configuration
      sasl:
        enabled: ${KAFKA_SASL_ENABLED:true}
        mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
        security-protocol: ${KAFKA_SASL_SECURITY_PROTOCOL:SASL_PLAINTEXT}
        username: ${KAFKA_SASL_USERNAME:admin}
        password: ${KAFKA_SASL_PASSWORD:123123a@}

      # Consumer Configuration
      consumer:
        group-id: rule-engine-group
        auto-offset-reset: latest
        enable-auto-commit: false
        max-poll: 500
        max-poll-interval: 300000
        isolation-level: read_committed
        concurrency: 12
        batch-listener: false
        ack-mode: MANUAL_IMMEDIATE
        session-timeout: 30000
        heartbeat-interval: 10000
        use-avro: false

        # JsonDeserializer Configuration
        properties:
          spring.json.trusted.packages: "vn.viettel.vds.promotion.*"
          spring.json.use.type.headers: true

        # Retry Configuration
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 1.5
          max-interval: 5000

        # Error Handling
        error-handling:
          enable-dlq: true
          dlq-topic-suffix: _dlq
          max-failures: 3
          include-headers: true

  # Cache Configuration
  cache:
    # MASTER SWITCH: Enable cache support globally (required for any cache provider)
    enabled: true

    # Keep Caffeine enabled for high-performance local caches (rule-bundles, limits-snapshots, kie-base)
    # These are configured in CacheConfiguration.java with custom CaffeineCacheManager
    caffeine:
      enabled: true

    # Disable standard Redis cache manager (replaced by Redisson)
    redis:
      enabled: false
      cluster:
        nodes: [ ]  # Empty to prevent initialization

    # Enable Redisson for distributed caching (secondary cache manager if needed)
    redisson:
      enabled: ${REDIS_ENABLED:true}
      mode: ${REDIS_MODE:CLUSTER}
      password: ${REDIS_PASSWORD:123123a@}
      connection-timeout: ${REDIS_CONNECTION_TIMEOUT:3000}
      timeout: ${REDIS_TIMEOUT:3000}
      retry-attempts: ${REDIS_RETRY_ATTEMPTS:3}
      retry-interval: ${REDIS_RETRY_INTERVAL:1500}
      default-ttl: ${REDIS_DEFAULT_TTL:30m}
      max-idle-time: ${REDIS_MAX_IDLE_TIME:15m}
      default-max-size: ${REDIS_DEFAULT_MAX_SIZE:1000}

      # Use JSON codec for better compatibility with Drools objects
      codec: org.redisson.codec.JsonJacksonCodec

      # Connection pool settings
      pool:
        min-idle: 5
        max-pool-size: 50

      # Redis cluster configuration
      cluster:
        nodes:
          - redis://node1:6379
          - redis://node2:6380
          - redis://node3:6381
        max-redirections: 3
        scan-interval: 1000

# Bundle Preload & Validation Sync Configuration
validation:
  engine:
    bundle:
      preload-enabled: true
      preload-on-startup: true
      preload-timeout-minutes: 10
      prewarm-session-pool: true
      prewarm-session-count: 3
      health-check-interval-seconds: 300
      refresh-ahead-enabled: true
      refresh-ahead-interval-ms: 900000
    session-pool:
      cleanup-interval-ms: 900000
  external-services:
    rules-service:
      base-url: http://rules-service

  # pp-validation Service (REST API for fetching rule bindings)
  service:
    url: ${VALIDATION_SERVICE_URL:http://localhost:16014}
    context-path: ${VALIDATION_SERVICE_CONTEXT_PATH:/promotion/promotion-validation}

  # Assignment Sync Configuration
  sync:
    startup-enabled: ${VALIDATION_SYNC_STARTUP_ENABLED:true}
    reconciliation-enabled: ${VALIDATION_SYNC_RECONCILIATION_ENABLED:true}
    reconciliation-interval-ms: ${VALIDATION_SYNC_RECONCILIATION_INTERVAL:900000}
    reconciliation-initial-delay-ms: ${VALIDATION_SYNC_RECONCILIATION_INITIAL_DELAY:450000}
    watchdog-interval-ms: ${VALIDATION_SYNC_WATCHDOG_INTERVAL:300000}
    watchdog-initial-delay-ms: ${VALIDATION_SYNC_WATCHDOG_INITIAL_DELAY:60000}
    page-size: ${VALIDATION_SYNC_PAGE_SIZE:100}

# Kafka Topics Configuration
kafka:
  topics:
    # Cache invalidation topic (broadcast pattern - all instances receive)
    bundle-cache-invalidation: promotion_bundle_cache_invalidation
    # Validation events from pp-validation (assignment sync)
    validation-events: promotion_validation_event

# Logging Configuration
logging:
  level:
    root: INFO
    vn.viettel.vds.promotion: INFO